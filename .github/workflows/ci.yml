name: Runtime CI Quality Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-runtime:
    name: Runtime Checks (Hadolint, ShellCheck, Python Unit Tests, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python Dependencies
        run: pip install pillow

      - name: Install Hadolint Linter
        run: |
          sudo wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Set up Trivy Security Scanner
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: 'latest'

      - name: Run Test Suite
        run: ./tests/run_tests.sh

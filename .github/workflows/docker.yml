name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Docker Image Tag (leave empty for git SHA and latest)'
        required: false
        type: string
      repository_name:
        description: 'Amazon ECR Repository Name'
        required: false
        default: 'dev-nextcloud-enterprise'
        type: string
      push_to_ecr:
        description: 'Push to Amazon ECR (false for dry-run build)'
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      image_tag:
        description: 'Custom Docker Image Tag (leave empty for git SHA and latest)'
        required: false
        type: string
        default: ''
      repository_name:
        description: 'Amazon ECR Repository Name'
        required: false
        type: string
        default: 'dev-nextcloud-enterprise'
      push_to_ecr:
        description: 'Push to Amazon ECR (false for dry-run build)'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
    outputs:
      image_uri:
        description: 'Primary Docker Image URI in ECR'
        value: ${{ jobs.build-and-push.outputs.primary_tag }}
      primary_tag:
        description: 'Primary Docker Image URI in ECR'
        value: ${{ jobs.build-and-push.outputs.primary_tag }}
      digest:
        description: 'Docker image digest'
        value: ${{ jobs.build-and-push.outputs.digest }}

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for repository checkout

concurrency:
  group: runtime-ecr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image to ECR
    runs-on: ubuntu-latest
    outputs:
      primary_tag: ${{ steps.meta.outputs.primary_tag }}
      digest: ${{ steps.build-push.outputs.digest }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ inputs.repository_name || 'dev-nextcloud-enterprise' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_RUNTIME || secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Connected to AWS Account ID: ${{ steps.aws-creds.outputs.aws-account-id }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          python3 -c "
          import boto3, os, sys, json
          from botocore.exceptions import ClientError

          region = os.environ['AWS_REGION']
          repo = os.environ['ECR_REPOSITORY']
          client = boto3.client('ecr', region_name=region)

          try:
              client.describe_repositories(repositoryNames=[repo])
              print(f'ECR repository {repo} already exists.')
          except ClientError as e:
              if e.response['Error']['Code'] == 'RepositoryNotFoundException':
                  print(f'Repository {repo} not found. Creating...')
                  client.create_repository(
                      repositoryName=repo,
                      imageScanningConfiguration={'scanOnPush': True},
                      tags=[{'Key': 'Environment', 'Value': '${{ github.ref_name }}'}]
                  )
                  print(f'Repository {repo} created successfully.')
              else:
                  print(f'Error describing repository: {e}')
                  sys.exit(1)

          lifecycle_policy = json.dumps({
              'rules': [
                  {
                      'rulePriority': 1,
                      'description': 'Expire untagged images older than 7 days',
                      'selection': {
                          'tagStatus': 'untagged',
                          'countType': 'sinceImagePushed',
                          'countUnit': 'days',
                          'countNumber': 7
                      },
                      'action': {'type': 'expire'}
                  },
                  {
                      'rulePriority': 2,
                      'description': 'Keep maximum 15 tagged images',
                      'selection': {
                          'tagStatus': 'any',
                          'countType': 'imageCountMoreThan',
                          'countNumber': 15
                      },
                      'action': {'type': 'expire'}
                  }
              ]
          })
          try:
              client.put_lifecycle_policy(repositoryName=repo, lifecyclePolicyText=lifecycle_policy)
              print(f'✅ ECR lifecycle policy configured on {repo}.')
          except Exception as lp_err:
              print(f'⚠️ Warning applying lifecycle policy: {lp_err}')
          "

      - name: Determine Docker Image Tags
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${REGISTRY}/${REPO}:${SHORT_SHA}"

          if [ -n "${{ inputs.image_tag }}" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:${{ inputs.image_tag }}"
            PRIMARY_TAG="${REGISTRY}/${REPO}:${{ inputs.image_tag }}"
          else
            PRIMARY_TAG="${REGISTRY}/${REPO}:${SHORT_SHA}"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:latest,${REGISTRY}/${REPO}:prod"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:dev"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          echo "Target tags: ${TAGS}"
          echo "Primary tag: ${PRIMARY_TAG}"

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push_to_ecr != false }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup AWS SOCI Indexer
        uses: aws-actions/soci-actions/setup@v0.1.0
        continue-on-error: true

      - name: Create and Push SOCI Index Artifacts
        continue-on-error: true
        run: |
          echo "Generating AWS SOCI Index for fast Fargate cold start..."
          soci create "${{ steps.meta.outputs.primary_tag }}" || true
          soci push "${{ steps.meta.outputs.primary_tag }}" || true

      - name: Deployment Summary & Verification
        run: |
          echo "============================================================"
          echo "🎉 Docker Golden Image successfully built and pushed to ECR!"
          echo "Registry    : ${{ steps.login-ecr.outputs.registry }}"
          echo "Repository  : ${{ env.ECR_REPOSITORY }}"
          echo "Image Digest: ${{ steps.build-push.outputs.digest }}"
          echo "Primary Tag : ${{ steps.meta.outputs.primary_tag }}"
          echo "============================================================"

      - name: Trigger GitOps Rollout in infra
        if: github.event_name != 'workflow_call' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'dev' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && env.GITOPS_TOKEN != ''
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          ENV_NAME="${{ (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'dev' }}"
          echo "Dispatching release event to ${ORG_NAME}/infra for target env: ${ENV_NAME}..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GITOPS_TOKEN}" \
            https://api.github.com/repos/${ORG_NAME}/infra/dispatches \
            -d "{\"event_type\": \"runtime_release\", \"client_payload\": {\"environment\": \"${ENV_NAME}\", \"tag\": \"${{ github.ref_name }}\", \"image\": \"${{ steps.meta.outputs.primary_tag }}\"}}"
          echo "✅ Release event dispatched to ${ORG_NAME}/infra."

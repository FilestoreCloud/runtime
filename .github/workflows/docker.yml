name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Docker Image Tag (leave empty for git SHA and latest)'
        required: false
        type: string
      repository_name:
        description: 'Amazon ECR Repository Name'
        required: false
        default: 'dev-nextcloud-enterprise'
        type: string
      push_to_ecr:
        description: 'Push to Amazon ECR (false for dry-run build)'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for repository checkout

concurrency:
  group: runtime-ecr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image to ECR
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ inputs.repository_name || 'dev-nextcloud-enterprise' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_RUNTIME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Connected to AWS Account ID: ${{ steps.aws-creds.outputs.aws-account-id }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine Docker Image Tags
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${REGISTRY}/${REPO}:${SHORT_SHA}"

          if [ -n "${{ inputs.image_tag }}" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:${{ inputs.image_tag }}"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:latest,${REGISTRY}/${REPO}:prod"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${REGISTRY}/${REPO}:dev"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "primary_tag=${REGISTRY}/${REPO}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Target tags: ${TAGS}"

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_to_ecr }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Summary & Verification
        run: |
          echo "============================================================"
          echo "🎉 Docker Golden Image successfully built and pushed to ECR!"
          echo "Registry    : ${{ steps.login-ecr.outputs.registry }}"
          echo "Repository  : ${{ env.ECR_REPOSITORY }}"
          echo "Image Digest: ${{ steps.build-push.outputs.digest }}"
          echo "Primary Tag : ${{ steps.meta.outputs.primary_tag }}"
          echo "============================================================"

      - name: Trigger GitOps Rollout in infra
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'dev' || github.event_name == 'workflow_dispatch') && env.GITOPS_TOKEN != ''
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          echo "Dispatching release event to ${ORG_NAME}/infra..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GITOPS_TOKEN}" \
            https://api.github.com/repos/${ORG_NAME}/infra/dispatches \
            -d "{\"event_type\": \"runtime_release\", \"client_payload\": {\"tag\": \"${{ github.ref_name }}\", \"image\": \"${{ steps.meta.outputs.primary_tag }}\"}}"
          echo "✅ Release event dispatched to ${ORG_NAME}/infra."

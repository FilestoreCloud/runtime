name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
          - custom
      repository_name:
        description: "Amazon ECR Repository Name (Leave empty to use <env>-nextcloud-enterprise)"
        required: false
        type: string
        default: ""
      scope:
        description: "Purge Scope"
        required: true
        type: choice
        default: all_images
        options:
          - all_images
          - untagged_only
          - specific_tag
      target_tag:
        description: "Target Tag (if scope is specific_tag, e.g. dev, latest)"
        required: false
        type: string
      delete_repository:
        description: "Delete the entire ECR repository after purging images"
        required: false
        default: false
        type: boolean
      confirmation:
        description: "Safety Confirmation: Type DESTROY to proceed"
        required: true
        type: string

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: destroy-runtime-images-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  purge-images:
    name: Purge ECR Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Verify Safety Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "❌ Purge aborted: You must type 'DESTROY' in the confirmation input to prevent accidental deletion."
            exit 1
          fi
          echo "⚠️ Confirmation verified. Processing runtime container image destroy/purge..."

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install boto3

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_RUNTIME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve Target ECR Repository
        id: target
        run: |
          ENV="${{ inputs.environment }}"
          CUSTOM_REPO="${{ inputs.repository_name }}"
          if [ -n "$CUSTOM_REPO" ]; then
            REPO="$CUSTOM_REPO"
          elif [ "$ENV" != "custom" ]; then
            REPO="${ENV}-nextcloud-enterprise"
          else
            REPO="dev-nextcloud-enterprise"
          fi
          echo "repo_name=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Target ECR repository: ${REPO}"

      - name: Execute ECR Image Purge / Repository Deletion
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPO_NAME: ${{ steps.target.outputs.repo_name }}
          SCOPE: ${{ inputs.scope }}
          TARGET_TAG: ${{ inputs.target_tag }}
          DELETE_REPO: ${{ inputs.delete_repository }}
        run: |
          python3 -c "
          import os, boto3
          from botocore.exceptions import ClientError

          region = os.environ['AWS_REGION']
          repo_name = os.environ.get('REPO_NAME', 'dev-nextcloud-enterprise')
          scope = os.environ.get('SCOPE', 'all_images')
          target_tag = os.environ.get('TARGET_TAG', '').strip()
          delete_repo = os.environ.get('DELETE_REPO', 'false').lower() == 'true'

          ecr = boto3.client('ecr', region_name=region)
          print(f'Connecting to ECR repository: {repo_name} ({region})')

          try:
              # Check if repository exists
              try:
                  ecr.describe_repositories(repositoryNames=[repo_name])
              except ClientError as e:
                  if e.response['Error']['Code'] == 'RepositoryNotFoundException':
                      print(f'ℹ️ ECR Repository {repo_name} does not exist or has already been deleted.')
                      exit(0)
                  raise

              if scope == 'specific_tag' and target_tag:
                  print(f'Deleting specific image tag: {target_tag}...')
                  try:
                      resp = ecr.batch_delete_image(repositoryName=repo_name, imageIds=[{'imageTag': target_tag}])
                      print('Deleted:', [img.get('imageTag') for img in resp.get('imageIds', [])])
                  except Exception as e:
                      print(f'Specific tag purge notice: {e}')
              else:
                  paginator = ecr.get_paginator('list_images')
                  filter_param = {'tagStatus': 'UNTAGGED'} if scope == 'untagged_only' else {}
                  image_ids = []
                  for page in paginator.paginate(repositoryName=repo_name, filter=filter_param):
                      image_ids.extend(page.get('imageIds', []))

                  if not image_ids:
                      print('ℹ️ No images found matching scope criteria.')
                  else:
                      print(f'Deleting {len(image_ids)} images in batches...')
                      for i in range(0, len(image_ids), 100):
                          chunk = image_ids[i:i + 100]
                          resp = ecr.batch_delete_image(repositoryName=repo_name, imageIds=chunk)
                          print(f'✓ Batch {i // 100 + 1}: Deleted {len(resp.get(\"imageIds\", []))} images.')
                      print('✅ ECR images purged successfully!')

              if delete_repo:
                  print(f'⚠️ Deleting ECR repository: {repo_name} (force=True)...')
                  ecr.delete_repository(repositoryName=repo_name, force=True)
                  print(f'✅ ECR repository {repo_name} deleted successfully!')
          except Exception as e:
              print(f'ECR execution note: {e}')
              raise
          "

      - name: Purge Summary
        run: |
          echo "============================================================"
          echo "🎉 ECR image purge completed successfully!"
          echo "Repository        : ${{ steps.target.outputs.repo_name }}"
          echo "Scope             : ${{ inputs.scope }}"
          echo "Repository Deleted: ${{ inputs.delete_repository }}"
          echo "============================================================"

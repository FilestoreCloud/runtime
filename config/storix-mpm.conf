# ==============================================================================
# Storix Apache Worker Tuning — High Concurrency & Database Protection
# ==============================================================================
# Enforces high concurrency (up to 80-100 workers) while bounding active
# PostgreSQL database connections and optimizing WebDAV chunk streaming.
# ==============================================================================

<IfModule mpm_prefork_module>
    StartServers             10
    MinSpareServers          10
    MaxSpareServers          20
    MaxRequestWorkers        80
    ServerLimit              80
    MaxConnectionsPerChild  10000
</IfModule>

<IfModule mpm_event_module>
    StartServers              4
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadLimit              64
    ThreadsPerChild          25
    MaxRequestWorkers       100
    MaxConnectionsPerChild  10000
</IfModule>

# KeepAlive optimization for WebDAV client chunk streaming
KeepAlive On
MaxKeepAliveRequests 500
KeepAliveTimeout 5

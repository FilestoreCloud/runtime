# ==============================================================================
# Storix Apache Worker Tuning — Database Connection Protection
# ==============================================================================
# In multi-tenant SaaS deployments, unbounded Apache processes can exhaust
# PostgreSQL connection limits (max_connections). These tuned worker limits
# enforce high concurrency while keeping active database sessions bounded.
# ==============================================================================

<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers       35
    ServerLimit             35
    MaxConnectionsPerChild  10000
</IfModule>

# KeepAlive optimization for WebDAV client chunk streaming
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2

# ==============================================================================
# Storix Apache RemoteIP Configuration — Reverse Proxy & HTTPS Detection
# ==============================================================================
# Properly extracts client IP from X-Forwarded-For when behind ALB / Cloudflare
# and marks HTTPS environment variable for secure redirect generation.
# ==============================================================================

<IfModule remoteip_module>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
    RemoteIPInternalProxy 127.0.0.1
    # Cloudflare IPv4 CIDRs
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
</IfModule>

# Set HTTPS indicator from ALB / Reverse Proxy header for Apache rewrite rules
<IfModule setenvif_module>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>
